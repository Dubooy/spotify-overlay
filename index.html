<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; media-src 'self' blob:">
<title>Isla</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Iconos (rellenos y redondeados, como los de Apple) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-back" viewBox="0 0 40 24"><path d="M18.6 3.4v17.2c0 1.2-1.3 1.9-2.3 1.2L3.4 13.2a1.45 1.45 0 0 1 0-2.4L16.3 2.2c1-.7 2.3 0 2.3 1.2zm19 0v17.2c0 1.2-1.3 1.9-2.3 1.2L22.4 13.2a1.45 1.45 0 0 1 0-2.4L35.3 2.2c1-.7 2.3 0 2.3 1.2z"/></symbol>
      <symbol id="i-fwd" viewBox="0 0 40 24"><path d="M21.4 3.4v17.2c0 1.2 1.3 1.9 2.3 1.2l12.9-8.6a1.45 1.45 0 0 0 0-2.4L23.7 2.2c-1-.7-2.3 0-2.3 1.2zm-19 0v17.2c0 1.2 1.3 1.9 2.3 1.2l12.9-8.6a1.45 1.45 0 0 0 0-2.4L4.7 2.2c-1-.7-2.3 0-2.3 1.2z"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M6 3.9c0-1.1 1.2-1.8 2.2-1.2l13 7.9a1.6 1.6 0 0 1 0 2.8l-13 7.9c-1 .6-2.2-.1-2.2-1.2z"/></symbol>
      <symbol id="i-pause" viewBox="0 0 24 24"><rect x="4.5" y="2.5" width="5.4" height="19" rx="1.4"/><rect x="14.1" y="2.5" width="5.4" height="19" rx="1.4"/></symbol>
    </defs>
  </svg>

  <div id="stage" class="mode-island skin-obsidiana">
    <div id="island" class="is-hidden" aria-label="Reproductor">
      <div class="gloss" aria-hidden="true"></div>

      <!-- Compacto: portada a la izquierda, onda a la derecha -->
      <div class="compact">
        <img class="art art-sm" alt="" draggable="false">
        <div class="eq eq-sm" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
      </div>

      <!-- Abierto (isla): misma distribución que la Dynamic Island -->
      <div class="expanded expanded-island">
        <div class="row-top">
          <img class="art art-lg" alt="" draggable="false">
          <div class="meta">
            <div class="title line-combo"><span>—</span></div>
            <div class="artist line-source"><span>—</span></div>
          </div>
          <div class="eq eq-lg" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
        </div>
        <div class="row-progress">
          <span class="t t-el">0:00</span>
          <div class="track"><div class="fill"></div></div>
          <span class="t t-rem">-0:00</span>
        </div>
        <div class="row-controls">
          <button class="btn prev" aria-label="Anterior"><svg class="ic-skip"><use href="#i-back"/></svg></button>
          <button class="btn play" aria-label="Reproducir o pausar">
            <svg class="ic-play"><use href="#i-play"/></svg>
            <svg class="ic-pause"><use href="#i-pause"/></svg>
          </button>
          <button class="btn next" aria-label="Siguiente"><svg class="ic-skip"><use href="#i-fwd"/></svg></button>
        </div>
      </div>

      <!-- Abierto (burbuja): una sola fila -->
      <div class="expanded expanded-bubble">
        <div class="meta">
          <div class="title line-title"><span>—</span></div>
          <div class="artist line-artist"><span>—</span></div>
        </div>
        <div class="row-controls">
          <button class="btn prev" aria-label="Anterior"><svg class="ic-skip"><use href="#i-back"/></svg></button>
          <button class="btn play" aria-label="Reproducir o pausar">
            <svg class="ic-play"><use href="#i-play"/></svg>
            <svg class="ic-pause"><use href="#i-pause"/></svg>
          </button>
          <button class="btn next" aria-label="Siguiente"><svg class="ic-skip"><use href="#i-fwd"/></svg></button>
        </div>
      </div>

      <!-- Disco de la burbuja con anillo de progreso -->
      <div class="disc" aria-hidden="true">
        <svg class="ring" viewBox="0 0 64 64"><circle class="ring-bg" cx="32" cy="32" r="30"/><circle class="ring-fg" cx="32" cy="32" r="30"/></svg>
        <img class="art art-disc" alt="" draggable="false">
      </div>
    </div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
